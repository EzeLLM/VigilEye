[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigileye"
version = "2.0.0"
description = "Open-source intelligence analysis framework on any OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["openai>=1.40", "httpx>=0.27", "PyYAML>=6", "Jinja2>=3.1"]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
vigileye = "vigileye.cli:main"

[tool.setuptools.packages.find]
include = ["vigileye*"]

[tool.setuptools.package-data]
vigileye = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
